# Déploiement continu : à chaque push sur main (après la CI), on construit
# les images Docker, on les publie sur GitHub Container Registry (GHCR),
# puis on met à jour le VPS en SSH.
#
# Configuration (Settings → Secrets and variables → Actions) :
#   Variables : NEXT_PUBLIC_APP_URL, S3_ENDPOINT, S3_PUBLIC_ORIGIN (facultatives pour S3)
#   Secrets   : VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR (ex. /opt/app)
# Active-le avec la variable DEPLOY_ENABLED=true (désactivé par défaut dans le template).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nom d'image en minuscules
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image de l'application
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
            S3_PUBLIC_ORIGIN=${{ vars.S3_PUBLIC_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image des migrations
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE }}-migrate:latest,${{ env.IMAGE }}-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mise à jour du serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull app migrate
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Vérification de santé
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ vars.NEXT_PUBLIC_APP_URL }}/api/health"; then exit 0; fi
            sleep 10
          done
          echo "Le site ne répond pas après le déploiement" && exit 1
