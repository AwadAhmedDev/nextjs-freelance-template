# PRODUCTION sur le VPS (voir docs/mise-en-production.md).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# Les secrets viennent du fichier .env présent UNIQUEMENT sur le serveur
# (modèle : .env.production.example). Docker Compose le lit automatiquement.
# Seul Caddy est exposé sur Internet (ports 80 et 443).

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/ton-compte/ton-projet}
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        S3_ENDPOINT: ${S3_ENDPOINT:-}
        S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Applique les migrations Prisma puis s'arrête. Lancé à chaque déploiement.
  migrate:
    image: ${APP_IMAGE:-ghcr.io/ton-compte/ton-projet}-migrate
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    profiles: [tools]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    # Aucun port publié : la base n'est jamais accessible depuis Internet.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [internal]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
