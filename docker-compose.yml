# DÉVELOPPEMENT : uniquement la base de données.
# L'application tourne avec `pnpm dev` sur ta machine (rechargement instantané).
#   docker compose up -d
#   docker compose down        (arrête, garde les données)
#   docker compose down -v     (arrête et EFFACE les données)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
